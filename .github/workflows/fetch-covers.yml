name: Fetch game covers as local WebP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image libraries
        run: python -m pip install -r requirements-covers.txt
      - name: Download and convert cover images
        run: python scripts/fetch_covers.py
      - name: Commit local covers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/covers data/cover_status.json data/cover_sources.json data/games.json
          if ! git diff --cached --quiet; then
            git commit -m 'Cache available game cover art as WebP'
            git push
          fi
