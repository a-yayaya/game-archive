<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <meta name="description" content="个人游戏档案与 Top 10。">
  <title>游戏档案</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top">游戏档案</a>
      <nav class="main-nav" aria-label="主导航">
        <a href="#rankings">Top 10</a>
        <a href="#library">游戏库</a>
      </nav>
      <button id="edit-toggle" class="header-edit" type="button" aria-label="管理游戏列表">管理 <span aria-hidden="true">↗</span></button>
    </div>
  </header>

  <main class="site-shell">
    <section class="ranking-section" id="rankings" aria-labelledby="ranking-heading">
      <div class="section-head ranking-head">
        <h1 id="ranking-heading">Top 10</h1>
        <div class="tab-group" role="tablist" aria-label="排行榜类型">
          <button class="rank-tab is-active" id="rank-favorites" type="button" role="tab" aria-selected="true" data-rank="favorites">心中最爱</button>
          <button class="rank-tab" id="rank-recommended" type="button" role="tab" aria-selected="false" data-rank="recommendations">推荐游玩</button>
        </div>
      </div>
      <div id="rank-scroll" class="rank-grid" aria-live="polite"></div>
      <p class="sr-only" id="rank-caption"></p>
    </section>

    <section class="library-section" id="library" aria-labelledby="library-title">
      <div class="section-head library-head">
        <div class="title-count"><h2 id="library-title">游戏库</h2><span class="collection-count" id="metric-all" aria-label="收录作品数量">—</span></div>
      </div>

      <div class="library-tools">
        <label class="search-box" aria-label="搜索游戏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.9" cy="10.9" r="7"/><path d="m16 16 5 5"/></svg>
          <input id="search-input" type="search" placeholder="搜索游戏" autocomplete="off" aria-label="搜索游戏">
          <kbd>/</kbd>
        </label>
        <label class="select-wrap"><span>类型</span><select id="genre-select" aria-label="筛选游戏类型"><option value="全部">全部类型</option></select></label>
        <label class="select-wrap"><span>状态</span><select id="status-select" aria-label="筛选游玩状态"><option value="全部">全部状态</option><option value="待确认">待确认</option><option value="想玩">想玩</option><option value="未开始">未开始</option><option value="正在玩">正在玩</option><option value="已通关">已通关</option><option value="玩过未通关">玩过未通关</option><option value="长线游玩">长线游玩</option><option value="暂停">暂停</option><option value="已弃坑">已弃坑</option></select></label>
        <label class="select-wrap"><span>排序</span><select id="sort-select" aria-label="排序方式"><option value="default">清单顺序</option><option value="name">名称</option><option value="genre">类型</option><option value="rating">评分</option></select></label>
      </div>
      <div class="library-meta">
        <div class="chip-row" id="quick-filters" aria-label="快速筛选">
          <button class="filter-chip is-active" type="button" data-filter="all">全部</button>
          <button class="filter-chip" type="button" data-filter="favorites">心中最爱</button>
          <button class="filter-chip" type="button" data-filter="recommendations">推荐</button>
          <button class="filter-chip" type="button" data-filter="backlog">待玩</button>
          <button class="filter-chip" type="button" data-filter="reviewed">有评价</button>
        </div>
        <span class="results-head" id="result-count" aria-live="polite">—</span>
      </div>
      <div class="games-grid" id="games-grid" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden><p>没有符合条件的游戏</p><button id="clear-filters" type="button" class="outline-button">清除筛选</button></div>
    </section>
  </main>

  <dialog class="detail-modal" id="game-dialog" aria-label="游戏详细资料"><button class="dialog-close" id="dialog-close" type="button" aria-label="关闭">×</button><div id="dialog-body"></div></dialog>
  <dialog class="manager-dialog" id="manager-dialog" aria-label="游戏管理"><button class="dialog-close" id="manager-close" type="button" aria-label="关闭">×</button><div class="manager-title"><h2>游戏管理</h2></div><p class="manager-warning">网页中的修改仅保存在当前浏览器。要更新 GitHub 网站，请导出 <code>games.json</code>，覆盖仓库的 <code>data/games.json</code> 并提交。</p><div class="manager-actions"><button class="primary-button" id="new-game" type="button">添加游戏</button><button class="outline-button" id="export-json" type="button">导出 JSON</button><button class="outline-button" id="import-json" type="button">导入 JSON</button><input id="import-input" type="file" accept=".json,application/json" hidden><button class="outline-button danger-button" id="reset-local" type="button">恢复初始数据</button></div><div class="manager-footer"><label class="edit-check"><input id="edit-mode-check" type="checkbox"> 编辑模式</label><span id="save-status" role="status"></span></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
